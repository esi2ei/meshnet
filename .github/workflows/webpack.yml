name: MeshNet CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Keep manual runs available for explicit validation outside pull requests.
  workflow_dispatch:
    inputs:
      run_android_instrumentation:
        description: "Run the Android API 36 emulator instrumentation suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meshnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and production build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload the tested web dashboard for Android packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshnet-web-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  android:
    needs: web
    name: Android debug APK and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the tested web dashboard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meshnet-web-dist-${{ github.sha }}
          path: dist

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 17 SDK packages
        id: install-android-sdk
        shell: bash
        run: |
          set -euo pipefail
          packages="$(sdkmanager --list --channel=3)"
          platform_package="$(printf '%s\n' "$packages" | awk -F'|' '/platforms;android-37([.]|[[:space:]]|$)/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }')"
          build_tools_package="$(printf '%s\n' "$packages" | awk -F'|' '/build-tools;37([.]|[[:space:]]|$)/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }')"
          if [[ -z "$platform_package" || -z "$build_tools_package" ]]; then
            printf '%s\n' "$packages" | grep -E 'platforms;android-37|build-tools;37' || true
            echo "Android 17 SDK Platform 37 and Build Tools 37 are not published to this runner's SDK repositories."
            exit 1
          fi
          echo "Installing SDK packages: $platform_package and $build_tools_package"
          sdkmanager --channel=3 "$platform_package" "$build_tools_package"
          build_tools_version="${build_tools_package#build-tools;}"
          echo "build_tools_version=$build_tools_version" >> "$GITHUB_OUTPUT"
          echo "Installed Android SDK platform directories:"
          find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar -print

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Build debug APK
        working-directory: mobile
        env:
          MESHNET_PREBUILT_WEB_ASSETS: "true"
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/meshnet-android-build.log"

      - name: Verify debug APK signature and checksum
        if: success()
        run: |
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/${{ steps.install-android-sdk.outputs.build_tools_version }}/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Enable KVM for Android emulator
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_android_instrumentation) }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run focused Android regression tests on API 36
        if: ${{ github.event_name == 'pull_request' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: MESHNET_PREBUILT_WEB_ASSETS=true bash -o pipefail -c 'gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.meshnet.app.MeshTransferReceiptStoreTest,com.meshnet.app.MeshOfflineWalletStoreTest,com.meshnet.app.MeshGroupMembershipStoreTest,com.meshnet.app.MeshMembershipSyncProtocolTest,com.meshnet.app.BundledDashboardAssetsTest,com.meshnet.app.MeshRouterReceiptTest,com.meshnet.app.MeshGroupDeliveryLedgerTest,com.meshnet.app.MeshOfflineLibraryTest,com.meshnet.app.MeshSecretStoreTest,com.meshnet.app.MeshQueueStoreTest,com.meshnet.app.MeshRouteRegistryTest,com.meshnet.app.MeshIpPacketRouterTest,com.meshnet.app.MeshFileTransferTest,com.meshnet.app.MeshOfflinePortalServerTest,com.meshnet.app.MeshPeerRegistryTest,com.meshnet.app.MeshDeviceIdentityTest,com.meshnet.app.MeshCryptoTest,com.meshnet.app.MeshFrameTest,com.meshnet.app.MeshServiceContractTest,com.meshnet.app.MeshWalletAuthorizationStoreTest,com.meshnet.app.MeshOfflineWalletEnvelopeTest,com.meshnet.app.MeshSocketPolicyTest 2>&1 | tee "$RUNNER_TEMP/meshnet-android-tests.log"'

      - name: Run full Android instrumentation suite on API 36
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_instrumentation }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: MESHNET_PREBUILT_WEB_ASSETS=true bash -o pipefail -c 'gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/meshnet-android-tests.log"'

      # Keep successful PR runs lean. Bundle Android reports with diagnostics only
      # after a failure or an explicit manual validation run.
      - name: Upload Android diagnostics and test reports when needed
        if: ${{ !cancelled() && (failure() || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshnet-android-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/meshnet-android-build.log
            ${{ runner.temp }}/meshnet-android-tests.log
            mobile/app/build/reports/
            mobile/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 3

      # Successful pull-request checks do not need downloadable build artifacts.
      # Keep diagnostics on failure; allow explicit manual runs to retain the APK.
      - name: Upload debug APK artifact
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'release/trial-apk' && github.event.pull_request.head.repo.full_name == github.repository)) && hashFiles('mobile/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshnet-debug-apk-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

