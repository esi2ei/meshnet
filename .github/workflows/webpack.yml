name: MeshNet CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Keep manual runs available for explicit validation outside pull requests.
  workflow_dispatch:
    inputs:
      run_android_instrumentation:
        description: "Run the Android API 36 emulator instrumentation suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meshnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and production build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload the tested web dashboard for Android packaging
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meshnet-web-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  android:
    needs: web
    name: Android debug APK and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the tested web dashboard
        uses: actions/download-artifact@v7.0.2
        with:
          name: meshnet-web-dist-${{ github.sha }}
          path: dist

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 16 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Build debug APK
        working-directory: mobile
        env:
          MESHNET_PREBUILT_WEB_ASSETS: "true"
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK signature and checksum
        if: success()
        run: |
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Enable KVM for Android emulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_instrumentation }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on API 36 emulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_instrumentation }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      # Successful pull-request checks do not need downloadable build artifacts.
      # Keep diagnostics on failure; allow explicit manual runs to retain the APK.
      - name: Upload debug APK artifact
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && hashFiles('mobile/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meshnet-debug-apk-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android test reports
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meshnet-android-test-reports-${{ github.sha }}
          path: |
            mobile/app/build/reports/androidTests/connected/
            mobile/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 3
