[features]
seeds = false
skip-lint = false

# Add a [programs.localnet] mapping before localnet deployment. Its
# meshnet_escrow value must equal MESHNET_ESCROW_PROGRAM_ID supplied to Cargo.

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --manifest-path programs/meshnet-escrow/Cargo.toml"
