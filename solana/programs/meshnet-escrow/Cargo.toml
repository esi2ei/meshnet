[package]
name = "meshnet-escrow"
version = "0.1.0"
description = "Non-custodial USDC order escrow for MeshNet"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]
name = "meshnet_escrow"

[features]
default = ["devnet"]
devnet = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", features = ["associated_token", "token"] }
